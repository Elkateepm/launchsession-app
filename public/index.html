<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale/minimum-scale removed: they disable pinch-zoom, which
         fails WCAG 1.4.4 and is exactly the thing a parent needs when a
         medical note is set in 11px. iOS ignores them in Safari anyway;
         they only ever bit users who genuinely needed to zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06091A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LaunchSession" />
    <title>LaunchSession | Sessions, registers and safeguarding for youth organisations</title>
    <meta name="description" content="LaunchSession is one place for youth and community organisations to plan sessions, take registers, manage volunteers, record safeguarding concerns and evidence impact." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LaunchSession" />
    <meta property="og:title" content="LaunchSession | Sessions, registers and safeguarding for youth organisations" />
    <meta property="og:description" content="Plan sessions, run registers, manage volunteers, support safeguarding and measure impact from one connected platform." />
    <meta property="og:image" content="https://launchsession.co.uk/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LaunchSession | Sessions, registers and safeguarding for youth organisations" />
    <meta name="twitter:description" content="Plan sessions, run registers, manage volunteers, support safeguarding and measure impact from one connected platform." />
    <meta name="twitter:image" content="https://launchsession.co.uk/logo.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Theme first, and synchronously: React mounting before data-theme is on
      // <html> means a white flash on every load for anyone using dark.
      (function () {
        try {
          var c = localStorage.getItem('ls_theme');
          // Only 'system' follows the device, and it has to be chosen. An
          // unset preference is light -- see DEFAULT_CHOICE in lib/theme.js.
          if (c === 'system') {
            c = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else if (c !== 'dark') {
            c = 'light';
          }
          document.documentElement.setAttribute('data-theme', c);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', c === 'dark' ? '#0F0F1A' : '#FFFFFF');
        } catch (e) { /* storage blocked; light is the safe default */ }
      })();
    </script>
    <script>
      // Resolve the org the same way OrgContext.js does (query param, then
      // subdomain, then a remembered slug), purely from the URL/localStorage
      // — no network round-trip — so the manifest link points at this org's
      // icon before the browser evaluates PWA installability.
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var slug = params.get('org');
          var host = window.location.hostname;
          if (!slug && host.indexOf('.launchsession.app') !== -1) {
            slug = host.split('.')[0];
          }
          if (!slug && host.indexOf('.launchsession.co.uk') !== -1) {
            var sub = host.split('.')[0];
            if (['www', 'launchsession', 'app', 'admin'].indexOf(sub) === -1) slug = sub;
          }
          if (!slug) {
            slug = localStorage.getItem('launchsession_org_slug') || localStorage.getItem('launchsession_remembered_org_slug');
          }
          if (slug) {
            var link = document.querySelector("link[rel='manifest']");
            if (link) link.setAttribute('href', '/api/manifest?org=' + encodeURIComponent(slug));
          }
        } catch (e) {
          // If anything above fails, the static /manifest.json link stays in place.
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>
      <h1>LaunchSession</h1>
      <p>
        LaunchSession is one place for youth and community organisations to plan sessions,
        take registers, manage volunteers, record safeguarding concerns and evidence impact.
      </p>
      <p>
        This part of LaunchSession needs JavaScript to run. Read about what it does at
        <a href="https://launchsession.co.uk/">launchsession.co.uk</a>, or email
        <a href="mailto:hello@launchsession.co.uk">hello@launchsession.co.uk</a>.
      </p>
    </noscript>
    <div id="root"></div>
  </body>
</html>
